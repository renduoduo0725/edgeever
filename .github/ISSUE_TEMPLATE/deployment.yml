name: 部署与连接
description: 自托管实例无法安装、更新或连接。
title: "[Deploy] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        先看仓库文档里的 Cloudflare 或 Docker 部署说明。仍然失败时再提交。

        GitHub Issue 公开可见。不要附上密码、Token、实例地址或笔记正文。需要对照地址时，维护者会在评论里单独询问。
  - type: dropdown
    id: deploy-method
    attributes:
      label: 部署方式
      description: How is this instance deployed?
      multiple: false
      options:
        - Cloudflare 一键部署
        - Cloudflare 手动部署
        - Docker
        - 官方 Demo
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 出问题的客户端
      description: Which client cannot connect? 纯服务端问题时选你用来访问的那个端。
      multiple: true
      options:
        - Web
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - Browser extension
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际看到的结果、报错原文。What did you see, including the exact error text?
      placeholder: 例如：桌面端登录一直显示 network_unreachable，浏览器打开同一地址可以登录。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 已经试过什么
      description: 包括文档中的哪一步、命令输出，以及是否用浏览器对照过。What have you already tried?
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: 系统信息
      description: 能打开应用时，粘贴「设置 → 系统信息」里复制的内容。应用还打不开时，写上实例版本、数据库后端和部署平台。
      placeholder: |
        - 实例构建: v1.93.0
        - 数据库后端: D1
        - 部署平台: Cloudflare
    validations:
      required: true
