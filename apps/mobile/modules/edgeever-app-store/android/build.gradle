plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.edgeever.appstore'
version = '1.0.0'

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
}

android {
  namespace "org.edgeever.appstore"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
