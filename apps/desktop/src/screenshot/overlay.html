<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EdgeEver Screenshot</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: #000;
      user-select: none;
    }
    #shot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #rect {
      position: absolute;
      display: none;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="shot" alt="" draggable="false" />
  <div id="rect"></div>
  <script>
    const api = window.edgeeverScreenshot;
    const shot = document.getElementById("shot");
    const rect = document.getElementById("rect");
    let origin = null;
    let objectUrl = null;

    const toBytes = (value) => {
      if (value instanceof Uint8Array) return value;
      if (value instanceof ArrayBuffer) return new Uint8Array(value);
      if (ArrayBuffer.isView(value)) return new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
      if (value && value.type === "Buffer" && Array.isArray(value.data)) return new Uint8Array(value.data);
      return new Uint8Array();
    };

    const selection = (event) => {
      const x = Math.min(origin.x, event.clientX);
      const y = Math.min(origin.y, event.clientY);
      return {
        x,
        y,
        width: Math.abs(event.clientX - origin.x),
        height: Math.abs(event.clientY - origin.y),
      };
    };

    api.onInit((payload) => {
      const bytes = toBytes(payload && payload.bytes);
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
      shot.src = objectUrl;
    });

    window.addEventListener("mousedown", (event) => {
      if (event.button !== 0) {
        api.cancel();
        return;
      }
      origin = { x: event.clientX, y: event.clientY };
      rect.style.display = "block";
      rect.style.left = `${origin.x}px`;
      rect.style.top = `${origin.y}px`;
      rect.style.width = "0px";
      rect.style.height = "0px";
    });

    window.addEventListener("mousemove", (event) => {
      if (!origin) return;
      const next = selection(event);
      rect.style.left = `${next.x}px`;
      rect.style.top = `${next.y}px`;
      rect.style.width = `${next.width}px`;
      rect.style.height = `${next.height}px`;
    });

    window.addEventListener("mouseup", (event) => {
      if (!origin) return;
      const next = selection(event);
      origin = null;
      api.complete(next);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") api.cancel();
    });

    window.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      api.cancel();
    });
  </script>
</body>
</html>
